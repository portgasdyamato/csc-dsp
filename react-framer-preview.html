      function ScrollExpandingPillars({ onSelectService }) {
        const sectionRef = useRef(null);
        const [activeIndex, setActiveIndex] = useState(0);

        const { scrollYProgress } = useScroll({
          target: sectionRef,
          offset: ['start start', 'end end'],
        });

        useMotionValueEvent(scrollYProgress, 'change', (latest) => {
          const clamped = Math.max(0, Math.min(0.999, latest));
          const idx = Math.floor(clamped * PILLARS_DATA.length);
          if (idx !== activeIndex) setActiveIndex(idx);
        });

        return (
          <section
            ref={sectionRef}
            id="scroll-pillars"
            className="relative h-[320vh] bg-white border-y border-slate-200/80"
          >
            <div className="sticky top-[68px] h-[calc(100vh-68px)] max-w-7xl mx-auto px-4 sm:px-8 flex flex-col justify-center">
              <div className="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-6">
                <div>
                  <span className="inline-flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-blue-700 bg-blue-100 px-3.5 py-1.5 rounded-full mb-2.5">
                    <Sparkles className="w-3.5 h-3.5" /> Scroll-Driven Interactive Showcase
                  </span>
                  <h2 className="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900">
                    Core Pillars of Digital Seva
                  </h2>
                  <p className="text-slate-600 text-sm sm:text-base mt-1">
                    Expands automatically as you scroll — or click any vertical capsule to inspect.
                  </p>
                </div>

                <div className="inline-flex items-center gap-3 bg-slate-100 px-4 py-2 rounded-full self-start md:self-auto">
                  <span className="text-xs font-bold text-slate-700 tabular-nums">
                    0{activeIndex + 1} / 0{PILLARS_DATA.length}
                  </span>
                  <div className="flex items-center gap-1.5">
                    {PILLARS_DATA.map((item, idx) => (
                      <button
                        key={item.id}
                        onClick={() => setActiveIndex(idx)}
                        className="relative h-2 rounded-full transition-all duration-300 cursor-pointer"
                        style={{
                          width: activeIndex === idx ? 28 : 8,
                          backgroundColor: activeIndex === idx ? '#1d4ed8' : '#cbd5e1',
                        }}
                      />
                    ))}
                  </div>
                </div>
              </div>

              <div className="flex items-stretch gap-2.5 sm:gap-3.5 h-[430px] sm:h-[500px] w-full select-none">
                {PILLARS_DATA.map((pillar, idx) => {
                  const isActive = idx === activeIndex;
                  return (
                    <motion.article
                      key={pillar.id}
                      layout
                      onClick={() => setActiveIndex(idx)}
                      initial={false}
                      animate={{
                        flex: isActive ? 5.6 : 0.65,
                        borderRadius: isActive ? 32 : 44,
                      }}
                      transition={{
                        type: 'spring',
                        stiffness: 210,
                        damping: 28,
                        mass: 0.9,
                      }}
                      className="relative h-full overflow-hidden cursor-pointer bg-slate-900 shadow-xl"
                    >
                      <motion.img
                        src={pillar.image}
                        alt={pillar.title}
                        initial={false}
                        animate={{
                          scale: isActive ? 1.0 : 1.12,
                          filter: isActive ? 'brightness(0.92)' : 'brightness(0.82)',
                        }}
                        transition={{ duration: 0.65, ease: [0.22, 1, 0.36, 1] }}
                        className="absolute inset-0 w-full h-full object-cover object-center pointer-events-none"
                      />
                      <motion.div
                        initial={false}
                        animate={{ opacity: isActive ? 1 : 0.15 }}
                        className="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-slate-950/25 to-transparent pointer-events-none"
                      />

                      <AnimatePresence>
                        {!isActive && (
                          <motion.span
                            initial={{ opacity: 0, scale: 0.6 }}
                            animate={{ opacity: 1, scale: 1 }}
                            exit={{ opacity: 0, scale: 0.6 }}
                            className="absolute bottom-5 left-1/2 -translate-x-1/2 w-9 h-9 rounded-full bg-white/85 backdrop-blur-md text-slate-900 text-xs font-extrabold grid place-items-center shadow"
                          >
                            {pillar.id}
                          </motion.span>
                        )}
                      </AnimatePresence>

                      <AnimatePresence>
                        {isActive && (
                          <motion.div
                            initial={{ opacity: 0, y: 22 }}
                            animate={{ opacity: 1, y: 0 }}
                            exit={{ opacity: 0, y: 14 }}
                            transition={{
                              type: 'spring',
                              stiffness: 240,
                              damping: 24,
                              delay: 0.12,
                            }}
                            className="absolute inset-x-0 bottom-0 p-6 sm:p-9 flex items-end justify-between gap-4 z-10"
                          >
                            <div className="max-w-xl text-white">

                              </h3>
                              <p className="text-xs sm:text-sm text-slate-200/90 mt-1.5 leading-relaxed">
                                {pillar.subtitle}
                              </p>
                            </div>

                            <motion.button
                              whileHover={{ scale: 1.12, x: 3 }}
                              whileTap={{ scale: 0.94 }}
                              onClick={(e) => {

                                onSelectService(pillar.title);

                            >

                            </motion.button>
                          </motion.div>
                        )}
                      </AnimatePresence>
                    </motion.article>
                  );
                })}
              </div>
            </div>
          </section>
        );

        const [activeIndex, setActiveIndex] = useState(2);
        const total = STORIES_DATA.length;

        const paginate = (dir) => {
          setActiveIndex((prev) => ((prev + dir) % total + total) % total);
        };

        const getSignedOffset = (index) => {
          let diff = index - activeIndex;
          if (diff > total / 2) diff -= total;
          if (diff < -total / 2) diff += total;
          return diff;
        };

        const activeStory = STORIES_DATA[activeIndex];

          <section id="stories" className="py-24 px-4 sm:px-8 bg-white overflow-hidden">

                  const offset = getSignedOffset(idx);
                  const slot = FAN_SLOT_STYLES[offset] || {
                    x: 0,
                    y: 60,
                    rotate: 0,
                    scale: 0.6,
                    zIndex: 1,
                    brightness: 0.7,
                  };
                  const isCenter = offset === 0;

                  return (
                    <motion.div
                      key={story.id}
                      onClick={() => {
                        if (!isCenter) setActiveIndex(idx);
                        else onSelectStory(story.title);
                      }}
                      drag={isCenter ? 'x' : false}
                      dragConstraints={{ left: 0, right: 0 }}
                      onDragEnd={(_, info) => {
                        if (info.offset.x < -50) paginate(1);
                        else if (info.offset.x > 50) paginate(-1);
                      }}
                      initial={false}
                      animate={{
                        x: slot.x,
                        y: slot.y,
                        rotate: slot.rotate,
                        scale: slot.scale,
                        zIndex: slot.zIndex,
                        filter: `brightness(${slot.brightness})`,
                      }}
                      whileHover={
                        isCenter

                      transition={{ type: 'spring', stiffness: 240, damping: 25, mass: 0.9 }}
                      className="absolute w-[230px] sm:w-[265px] h-[330px] sm:h-[365px] rounded-[22px] overflow-hidden cursor-pointer bg-slate-900 border-[3px] border-white shadow-[0_24px_55px_rgba(15,23,42,0.22)]"

                        <span className="text-[11px] font-semibold text-blue-300">
                          {story.category}
                        </span>
                        <h4 className="text-base font-bold leading-snug">
                          {story.cardLabel}
                        </h4>
                      </div>
                    </motion.div>
                  );
                })}
              </div>

              <div className="flex items-center justify-center gap-8 sm:gap-14 mt-3">

                  className="fixed bottom-6 right-6 bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-2.5 text-sm font-semibold z-50"
                >
                  <CheckCircle2 className="w-4 h-4 text-emerald-400" />
                  <span>{toastMessage}</span>
                </motion.div>
              )}
            </AnimatePresence>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
